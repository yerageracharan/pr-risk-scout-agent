name: tests-and-real-pr-benchmark

on:
  push:
    branches: [main]
    paths:
      - "pr_risk_scout/**"
      - "tests/**"
      - "benchmarks/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "pr_risk_scout/**"
      - "tests/**"
      - "benchmarks/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-risk-scout-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile package and benchmarks
        run: python -m compileall -q pr_risk_scout benchmarks
      - name: Run unit tests
        run: python -m pytest -q

  real-public-pr-benchmark:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install benchmark dependencies
        run: python -m pip install -r requirements.txt
      - name: Analyse pinned public pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m benchmarks.run_real_benchmark
      - name: Upload benchmark report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-pr-benchmark
          path: benchmarks/results/real_pr_benchmark.json
          if-no-files-found: error

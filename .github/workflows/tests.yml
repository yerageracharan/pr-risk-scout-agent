name: tests-and-real-pr-benchmark

on:
  push:
    branches: [main]
    paths:
      - "pr_risk_scout/**"
      - "tests/**"
      - "benchmarks/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "pr_risk_scout/**"
      - "tests/**"
      - "benchmarks/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-risk-scout-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile package and benchmarks
        run: python -m compileall -q pr_risk_scout benchmarks
      - name: Run unit tests
        run: python -m pytest -q

  real-public-pr-benchmark:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install benchmark dependencies
        run: python -m pip install -r requirements.txt
      - name: Analyse pinned public pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m benchmarks.run_real_benchmark
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: real-pr-benchmark
          path: benchmarks/results/real_pr_benchmark.json
          if-no-files-found: error
